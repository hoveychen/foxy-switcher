[package]
name = "foxy-switcher"
version = "0.1.0"
description = "OAuth account pool for Claude Code"
authors = ["foxy-switcher"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "foxy_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
tokio = { version = "1", features = ["signal", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
