name: CI

# Lightweight per-push checks: frontend type-check/build + Go server tests on
# a single Linux runner. Full multi-platform Tauri bundles are reserved for
# `release.yml` (triggered by `v*` tags) to keep Actions usage down.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Frontend build (tsc + vite)
        run: pnpm build

      - name: Go server tests
        working-directory: server
        run: go test ./...
