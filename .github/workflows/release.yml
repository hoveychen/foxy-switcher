name: Release

# Tag-driven release: push `vX.Y.Z` to build & upload signed .pkg + .msi as a
# draft GitHub Release.
#
# ============================================================================
# Required GitHub Secrets (signing is auto-skipped when a secret is unset, so
# you can dry-run the workflow before configuring everything).
# ============================================================================
#
# macOS — Developer ID signing + notarization:
#   APPLE_CERTIFICATE                 base64(p12) of "Developer ID Application"
#   APPLE_CERTIFICATE_PASSWORD        password for the Application p12
#   APPLE_INSTALLER_CERTIFICATE       base64(p12) of "Developer ID Installer"
#   APPLE_INSTALLER_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY            e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_INSTALLER_SIGNING_IDENTITY  e.g. "Developer ID Installer: Name (TEAMID)"
#   APPLE_TEAM_ID                     10-char team id
#   APPLE_API_KEY                     base64 of the App Store Connect .p8 key
#   APPLE_API_KEY_ID                  10-char Key ID from App Store Connect
#   APPLE_API_ISSUER                  UUID Issuer ID from App Store Connect
#   KEYCHAIN_PASSWORD                 any throwaway password for the temp keychain
#
# Windows — Authenticode signing:
#   WINDOWS_CERTIFICATE               base64(pfx)
#   WINDOWS_CERTIFICATE_PASSWORD
#
# Encode certs with: `base64 -i cert.p12 | pbcopy`  (macOS)
#                    `base64 -w0 cert.pfx`           (Linux)
# ============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Create the GitHub Release once, with a hand-written install template
  # followed by GitHub's auto-generated commit list. All build jobs depend on
  # this job and only upload assets — they never regenerate notes, which is
  # what previously produced N copies of "Full Changelog: ..." (one per
  # matrix leg of `release` + `release-linux`).
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Compose body & create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: ref '$REF_NAME' is not vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${REF_NAME#v}"

          # Pull GitHub's auto-generated changelog (## What's Changed +
          # Full Changelog compare link) so we can place it after the
          # install template instead of letting it float on its own.
          AUTO=$(gh api --method POST "repos/$REPO/releases/generate-notes" \
            -f tag_name="$REF_NAME" --jq .body)

          # Heredoc backticks are escaped (\`) so bash doesn't treat code
          # fences as command substitution. $VAR expansions are intentional.
          cat > body.md <<EOF
          ## 📦 Install

          ### macOS — Universal .pkg (signed & notarized, Apple Silicon + Intel)
          \`\`\`
          curl -LO https://github.com/$REPO/releases/download/$REF_NAME/FoxySwitcher_${VERSION}_universal.pkg
          open FoxySwitcher_${VERSION}_universal.pkg
          \`\`\`

          ### Windows — Signed .msi
          \`\`\`
          curl -LO https://github.com/$REPO/releases/download/$REF_NAME/FoxySwitcher_${VERSION}_x64_en-US.msi
          \`\`\`

          ### Linux — Static binary (TUI + embedded vault webapp)
          \`\`\`
          curl -LO https://github.com/$REPO/releases/download/$REF_NAME/foxy-switcher-linux-amd64
          chmod +x foxy-switcher-linux-amd64
          ./foxy-switcher-linux-amd64
          \`\`\`
          (linux-arm64 also available — swap \`amd64\` → \`arm64\`)

          ### Docker — Multi-arch image on GHCR
          \`\`\`
          docker pull ghcr.io/$OWNER/foxy-switcher:$VERSION
          docker pull ghcr.io/$OWNER/foxy-switcher:latest
          \`\`\`

          ## 🔐 Verify
          Linux binaries publish \`.sha256\` sidecars next to them:
          \`\`\`
          sha256sum -c foxy-switcher-linux-amd64.sha256
          \`\`\`

          ---

          $AUTO
          EOF

          echo "===== body.md ====="
          cat body.md
          echo "==================="

          # Idempotent: if a release for this tag already exists (e.g. someone
          # pre-created it via `gh release create` or the web UI before pushing
          # the tag), edit its title/notes instead of failing with HTTP 422.
          if gh release view "$REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "==> release $REF_NAME already exists; editing title and notes"
            gh release edit "$REF_NAME" \
              --repo "$REPO" \
              --title "$REF_NAME" \
              --notes-file body.md \
              --draft=false
          else
            gh release create "$REF_NAME" \
              --repo "$REPO" \
              --title "$REF_NAME" \
              --notes-file body.md
          fi

  release:
    name: release (${{ matrix.label }})
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            os: macos-latest
            tauri_args: --target universal-apple-darwin --bundles app
            sidecar_mode: darwin
            artifact_glob: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.pkg
          - label: windows
            os: windows-latest
            tauri_args: --bundles msi
            sidecar_mode: host
            artifact_glob: src-tauri/target/release/bundle/msi/*.msi

    env:
      # Surface secrets as env so step-level `if: env.X != ''` can gate signing
      # without conditionally referencing `secrets.*` (which isn't allowed in
      # `if`). Unset secrets evaluate to '' and the step is skipped.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.label == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.label }}

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: ref '$REF_NAME' is not vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${REF_NAME#v}"
          echo "==> syncing version to $VERSION"
          NEW_VERSION="$VERSION" node -e '
            const fs = require("fs");
            const v = process.env.NEW_VERSION;
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8");
            const updated = cargo.replace(/^version = ".*"$/m, `version = "${v}"`);
            if (updated === cargo) throw new Error("Cargo.toml version line not found");
            fs.writeFileSync(cargoPath, updated);
          '

      - name: Frontend build
        run: pnpm build

      - name: Build Go sidecar
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/build-server.sh ${{ matrix.sidecar_mode }}

      # ---- macOS: import signing certs into a temp keychain -----------------
      - name: Import Apple certificates
        if: matrix.label == 'macos' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          # GitHub UI 粘贴 secret 时常带尾随 CR/LF；shell 展开后会让
          # `security import -P` 拿到错密码并报 "MAC verification failed
          # (wrong password?)"。这里统一剥掉换行/回车再用。
          APPLE_CERTIFICATE_PASSWORD="$(printf '%s' "$APPLE_CERTIFICATE_PASSWORD" | tr -d '\r\n')"
          APPLE_INSTALLER_CERTIFICATE_PASSWORD="$(printf '%s' "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" | tr -d '\r\n')"
          KEYCHAIN_PASSWORD="$(printf '%s' "$KEYCHAIN_PASSWORD" | tr -d '\r\n')"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          import_p12() {
            local label="$1" b64="$2" pwd="$3" p12="$RUNNER_TEMP/$1.p12"
            shift 3
            printf '%s' "$b64" | base64 --decode > "$p12"
            local size sha
            size="$(wc -c < "$p12" | tr -d ' ')"
            sha="$(shasum -a 256 "$p12" | awk '{print $1}')"
            echo "==> $label.p12 size=$size sha256=$sha pwd_len=${#pwd}"
            if ! security import "$p12" -k "$KEYCHAIN_PATH" -P "$pwd" "$@"; then
              echo "::error::failed to import $label — verify the password and base64 integrity of its GitHub secret"
              rm -f "$p12"
              return 1
            fi
            rm -f "$p12"
          }

          import_p12 app "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          if [ -n "${APPLE_INSTALLER_CERTIFICATE:-}" ]; then
            import_p12 installer "$APPLE_INSTALLER_CERTIFICATE" "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
              -T /usr/bin/productsign -T /usr/bin/security
          fi

          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

      - name: Tauri build
        shell: bash
        run: pnpm tauri build ${{ matrix.tauri_args }}

      - name: Wrap (and sign) .pkg
        if: matrix.label == 'macos'
        shell: bash
        run: scripts/build-pkg.sh universal-apple-darwin

      - name: Notarize and staple .pkg
        if: matrix.label == 'macos' && env.APPLE_API_KEY != ''
        shell: bash
        run: |
          PKG="$(ls src-tauri/target/universal-apple-darwin/release/bundle/macos/*.pkg | head -n1)"
          P8="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$P8"' EXIT
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$P8"
          chmod 600 "$P8"
          echo "==> notarizing $PKG"
          xcrun notarytool submit "$PKG" \
            --key "$P8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$PKG"

      # ---- Windows: signtool over the produced .msi -------------------------
      - name: Sign MSI
        if: matrix.label == 'windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | ForEach-Object {
            & $signtool sign /fd SHA256 /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($_.FullName)" }
          }
          Remove-Item $pfx

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          draft: false
          fail_on_unmatched_files: true

  # Linux ships the standalone Go binary instead of a Tauri bundle. The same
  # executable runs the TUI by default and the desktop-callable daemon under
  # `--server`, so headless / SSH users get a one-file install. We also bake
  # the React account panel into the binary via //go:embed so a Linux user
  # running `--mode=vault` gets the embedded /app surface without a separate
  # frontend deployment.
  #
  # We ship both amd64 and arm64 binaries: the Dockerfile downstream selects
  # one per TARGETPLATFORM during multi-arch image builds, and ARM Linux
  # users (rPi / arm64 VPS) get a native install without rebuilding from src.
  release-linux:
    name: release (linux-${{ matrix.goarch }})
    needs: [create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build React webapp
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Bake webapp into Go embed dir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf server/vault/webapp/static
          mkdir -p server/vault/webapp/static
          cp -R dist/* server/vault/webapp/static/
          : > server/vault/webapp/static/.gitkeep
          ls server/vault/webapp/static | head -5

      - name: Build foxy-switcher (linux/${{ matrix.goarch }})
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          ( cd server && go build -trimpath \
              -ldflags="-s -w -X github.com/hoveychen/foxy-switcher/server/deviceinfo.Version=${REF_NAME}" \
              -o "../dist-bin/foxy-switcher-linux-${GOARCH}" . )
          chmod +x "dist-bin/foxy-switcher-linux-${GOARCH}"
          stat -c '%n %s bytes' "dist-bin/foxy-switcher-linux-${GOARCH}"

      - name: Generate sha256
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist-bin
          sha256sum "foxy-switcher-linux-${GOARCH}" > "foxy-switcher-linux-${GOARCH}.sha256"
          cat "foxy-switcher-linux-${GOARCH}.sha256"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/foxy-switcher-linux-${{ matrix.goarch }}
            dist-bin/foxy-switcher-linux-${{ matrix.goarch }}.sha256
          draft: false
          fail_on_unmatched_files: true

  # Build and push the cloud-vault image to GHCR. The Dockerfile fetches
  # the per-arch binary from the GitHub Release the previous jobs just
  # published, so we need release-linux (both arches) to finish first.
  # buildx targets linux/amd64,linux/arm64; the Dockerfile's fetch stage
  # is pinned to $BUILDPLATFORM to avoid running curl under qemu.
  docker-publish:
    name: docker-publish (ghcr)
    needs: [release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/foxy-switcher
          # On a tag like `v1.2.3`, semver patterns produce `1.2.3` and
          # `1.2`; `latest` is added explicitly so a plain `docker pull`
          # always lands on the most recent published tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pass the tag through so the Dockerfile fetch stage downloads
          # the matching release asset (e.g. v1.2.3) instead of falling
          # back to the hard-coded default.
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: false
